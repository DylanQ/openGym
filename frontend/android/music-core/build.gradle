// MusicCore — the Capacitor plugin that fronts the grafted BitChord playback engine.
//
// SPIKE SKELETON (2026-10-23): this module currently holds only the plugin bridge and
// the engine seam (MusicCoreEngine). The BitChord engine itself — its :shared KMP
// module, the :app data layer and the playback package — is grafted into (and under)
// this module in the engine phase; see README.md in this directory and the spike
// notes in the goal's hidden_files (bitchord-spike-notes.md).
//
// Self-contained buildscript (the pattern capacitor-cordova-android-plugins uses) so
// the Kotlin graft touches no other build file: AGP matches the project's 8.13.0 and
// the Kotlin plugin is BitChord's own version, 2.3.20.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "ch.duartesantos.opengym.music"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 37
    defaultConfig {
        // The build graft raised the whole app to minSdk 26 / compileSdk 37
        // (BitChord's floor; InnerTubeX does not run below it). The fallbacks
        // here match, so the module reads the same numbers with or without
        // variables.gradle.
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    lintOptions {
        abortOnError = false
    }
}

repositories {
    google()
    mavenCentral()
    // JitPack: NewPipeExtractor and its nanojson dependency (below) are
    // published only there; also declared centrally in the root build.gradle.
    maven { url 'https://jitpack.io' }
}

/*
 * NewPipeExtractor ships its own org.schabi.newpipe.extractor.utils.Utils,
 * and the grafted tree will carry a patched copy at the same package path
 * (that is why the patched copy exists upstream — see the playback/data port
 * when it lands). A debug build keeps project and library dex separate, so
 * the project copy simply wins at class-load time and the two coexist; a
 * merged dex rejects the duplicate type outright ("Utils is defined multiple
 * times"). So the library's copy is stripped from its jar before it reaches
 * dexing, leaving exactly one definition of the class in the build.
 *
 * Ported from BitChord's app/build.gradle.kts (the stripNewPipeExtractorUtils
 * task); the artifact is resolved on its own and non-transitive purely to
 * re-jar it, and the transitive dependencies it would otherwise have carried
 * are declared by hand in the dependencies block below.
 */
def newPipeExtractorRawConfig = configurations.create('newPipeExtractorRaw') {
    transitive = false
    canBeConsumed = false
}
dependencies {
    add('newPipeExtractorRaw', 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3')
}
def newPipeExtractorStripped = tasks.register('stripNewPipeExtractorUtils', Jar) {
    archiveFileName.set('NewPipeExtractor-v0.26.3-noutils.jar')
    destinationDirectory.set(layout.buildDirectory.dir('stripped-libs'))
    from({
        newPipeExtractorRawConfig.collect { zipTree(it) }
    }) {
        // The class itself, plus any nested or synthetic siblings the upstream
        // compiler emitted alongside it, so nothing from the jar's Utils survives.
        exclude 'org/schabi/newpipe/extractor/utils/Utils.class'
        exclude 'org/schabi/newpipe/extractor/utils/Utils$*.class'
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.20"

    // The grafted BitChord :shared KMP module (extraction, repositories,
    // addon protocol). Its own api dependencies (Ktor, InnerTubeX, …) ride
    // along; NewPipe stays compile-only there by design — the runtime copy
    // is the stripped jar below.
    implementation project(':music-shared')

    // Media3: the vendored FFmpeg decoder sources under
    // src/main/java/androidx/media3/decoder/ffmpeg compile against these
    // (and the playback port builds on the same stack). Upstream pins
    // Media3 at 1.11.0.
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-common:1.11.0'
    // The FFmpeg sources annotate with Checker Framework nullness
    // (@Nullable, @MonotonicNonNull). Media3 keeps checker-qual as a
    // compile-only dependency of its own decoder module and does not
    // export it, so the vendored sources need it declared here; upstream
    // gets it transitively (via Guava in the phone's graph), we declare
    // it directly.
    implementation 'org.checkerframework:checker-qual:3.43.0'
    // Same story for androidx.annotation: the sources import
    // androidx.annotation.Nullable, but media3-common only carries
    // androidx.annotation on its runtime variant, not its api variant, so
    // it does not reach this module's compile classpath on its own.
    implementation 'androidx.annotation:annotation:1.6.0'

    // JS module execution: QuickJS VM for style source plugins. Held at
    // InnerTubeX's version; the same VM runs the shared module's JS sources
    // once the engine port wires them up. (BitChord declares this in its app
    // module; here the consuming module is this one.)
    implementation 'io.github.dokar3:quickjs-kt-android:1.0.14'

    // Stream resolution: NewPipe solves YouTube's signature + `n`
    // throttling. Consumed as the stripped jar rather than as the module, so
    // its own Utils.class does not reach dexing (see the task above); the
    // transitive dependencies the module would have brought are listed here
    // because dropping its artifact drops them too — upstream's list,
    // unchanged.
    implementation files(newPipeExtractorStripped)
    implementation 'com.github.TeamNewPipe:nanojson:e9d656ddb49a412a5a0a5d5ef20ca7ef09549996'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.protobuf:protobuf-javalite:4.35.0'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'org.mozilla:rhino-engine:1.8.1'
}
