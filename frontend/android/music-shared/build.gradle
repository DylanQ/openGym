// MusicShared — BitChord's `:shared` KMP module, grafted (build graft phase,
// 2026-10-24; no engine behaviour yet — see ../music-core/README.md and the
// goal's hidden_files/bitchord-spike-notes.md §5 step 3 / §6.1).
//
// The sources under src/commonMain and src/jvmSharedMain are unmodified copies
// of BitChord @ edc1e6f (GPLv3); the full graft record is in the repo-root
// CHANGES-BITCHORD.md. This build file is our Groovy adaptation of BitChord's
// shared/build.gradle.kts — same plugins (Kotlin Multiplatform 2.3.20,
// AGP library, serialization), same source-set shape (jvmSharedMain sits
// between commonMain and the android target, exactly as upstream wires it),
// same dependency pins.
//
// Two environment adaptations, both forced by this project's toolchain
// (AGP 8.13.0 where upstream runs 8.10.1) and recorded in the graft notes:
//  1. Plugins are applied the legacy way from this module's own buildscript
//     classpath (the pattern the sibling music-core module uses), and the
//     Kotlin plugin additionally sits on the ROOT buildscript classpath —
//     with KGP split across two classloader realms, AGP registers the
//     org.jetbrains.kotlin.platform.type attribute as a String while KGP
//     registers it as its enum, and this module fails to configure.
//  2. compileSdkMinor is pinned to 0: AGP 8.13 addresses platforms as
//     major.minor ("android-37.0" is the only API-37 platform there is), and
//     an unpinned compileSdk 37 looks for a target "android-37" that no
//     installed platform provides. The root build.gradle pins the same for
//     every classic module.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.3.20'
    }
}

apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

kotlin {
    androidTarget {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                // Models in this module intentionally have no Android or
                // Compose dependency. (Upstream pin; jvmSharedMain's api
                // 1.11.0 below wins at resolution, as upstream.)
                implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
            }
        }
    }
}

// Upstream's jvmSharedMain: an intermediate source set both the android and
// the (not grafted) desktop JVM targets hang off. Wired exactly as upstream:
// it depends on commonMain, and androidMain depends on it.
def musicCommonMain = kotlin.sourceSets.getByName('commonMain')
def musicJvmSharedMain = kotlin.sourceSets.create('jvmSharedMain')
musicJvmSharedMain.dependsOn(musicCommonMain)
kotlin.sourceSets.getByName('androidMain').dependsOn(musicJvmSharedMain)

musicJvmSharedMain.dependencies {
    // Compile-only: the consuming application supplies the runtime artifact
    // itself (upstream's arrangement for the ONNX runtime).
    compileOnly 'com.microsoft.onnxruntime:onnxruntime:1.20.0'
    // The network stack the lyrics providers and the YouTube Music client
    // run on, at the phone's versions.
    api 'io.ktor:ktor-client-core:3.5.2'
    api 'io.ktor:ktor-client-okhttp:3.5.2'
    api 'io.ktor:ktor-client-websockets:3.5.2'
    api 'io.ktor:ktor-client-content-negotiation:3.5.2'
    api 'io.ktor:ktor-serialization-kotlinx-json:3.5.2'
    api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    api 'org.jsoup:jsoup:1.22.2'
    // YouTube stream resolution, as the phone does it: InnerTubeX's client
    // catalog and cipher tiers, NewPipe as the fallback. NewPipe is
    // compile-only because the consumer ships a trimmed jar of it (see the
    // stripNewPipeExtractorUtils task in ../music-core/build.gradle).
    // GRAFT ADAPTATION: upstream declares the KMP root coordinate
    // (innertubex), whose android variant is an available-at redirect to
    // this artifact. AGP 8.13's checkAarMetadata task resolves the redirect
    // itself for the aar-metadata transform and NPEs on the artifact-less
    // root ("path is null"). The android artifact is byte-identical code
    // (same package, same classes), so it is declared directly.
    api 'com.github.MetrolistGroup.innertubex:innertubex-android:v0.7.0'
    compileOnly 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3'
}

android {
    namespace = 'com.music.bitchord.shared'
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 37
    compileSdkMinor = 0
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lintOptions {
        abortOnError = false
    }
}

repositories {
    google()
    mavenCentral()
    // InnerTubeX and NewPipeExtractor are published via JitPack (the repo
    // BitChord declares centrally in its settings; also declared in the root
    // build.gradle's allprojects here).
    maven { url 'https://jitpack.io' }
}
